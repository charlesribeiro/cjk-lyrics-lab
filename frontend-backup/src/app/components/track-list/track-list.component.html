<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">CJK Lyrics Lab</h1>
    <button 
      (click)="addNewTrack()"
      class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
      + Add New Track
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div 
      *ngFor="let track of tracks"
      (click)="viewTrack(track.id)"
      class="bg-white rounded-lg shadow hover:shadow-lg transition-shadow cursor-pointer p-6">
      <h2 class="text-xl font-bold mb-2">{{ track.title }}</h2>
      <p class="text-gray-600 mb-4">{{ track.artist }}</p>
      <div class="flex flex-wrap gap-2">
        <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">
          {{ track.language === 'ja' ? '🇯🇵 Japanese' : track.language === 'ko' ? '🇰🇷 Korean' : '🇨🇳 Chinese' }}
        </span>
        <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm" *ngIf="track.difficulty">
          {{ track.difficulty }}
        </span>
      </div>
      <div class="mt-4 text-sm text-gray-500" *ngIf="track.lastStudied">
        Last studied: {{ track.lastStudied | date:'short' }}
      </div>
    </div>
  </div>

  <div *ngIf="tracks.length === 0" class="text-center py-12">
    <p class="text-gray-600 text-lg mb-4">No tracks yet. Add your first track to get started!</p>
    <button 
      (click)="addNewTrack()"
      class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
      + Add New Track
    </button>
  </div>
</div>
